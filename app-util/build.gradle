plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace "com.miteksystems.misnap.apputil"
    compileSdk project.compileSdkVersion
    buildToolsVersion = project.buildToolsVersion

    defaultConfig {
        minSdkVersion project.coreMinSdk
        targetSdkVersion project.targetSdkVersion
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility jdkVersion
        targetCompatibility jdkVersion
    }
    kotlinOptions {
        jvmTarget = jdkVersion.toString()
    }
}

dependencies {

    implementation "com.miteksystems.misnap:core:$misnapVersion"
    implementation "com.miteksystems.misnap:workflow:$misnapVersion"

    api libs.kotlin.stdlib.jdk8
    api libs.material
    api libs.androidx.viewbinding

}
